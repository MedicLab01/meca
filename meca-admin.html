*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* sidebar */
.sb{background:var(--navy);color:#c9d6ea;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:900;font-size:20px;letter-spacing:.06em;color:#fff;padding:0 10px 2px}.logo i{font-style:normal;color:var(--ac)}
.logo small{display:block;font-size:11px;letter-spacing:.12em;color:#7f93b3;font-weight:700;margin-top:2px}
.nv{margin-top:22px;display:flex;flex-direction:column;gap:2px}
.nv button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#c9d6ea;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:500}
.nv button:hover{background:rgba(255,255,255,.06)}
.nv button.on{background:var(--navy2);color:#fff;font-weight:700}
.nv .ct{margin-left:auto;background:var(--pr);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.nv .ct.z{display:none}
.sbf{margin-top:auto;font-size:12px;color:#7f93b3;padding:10px}
.sbf button{background:none;border:1px solid #2a4570;color:#9db0c8;border-radius:8px;padding:6px 10px;cursor:pointer;margin-top:8px;font-size:12px}
/* main */
.mn{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:18px 28px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top h1{font-size:19px;margin:0;font-weight:900;letter-spacing:-.02em}
.top .sp{flex:1}
.top input{border:1.5px solid var(--bd);border-radius:10px;padding:8px 12px;width:240px;background:var(--bg)}
.op{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.op select{border:1.5px solid var(--bd);border-radius:10px;padding:7px 10px;background:var(--card);font-weight:700;color:var(--tx)}
.ct-w{padding:24px 28px 60px;max-width:1280px}
.demo{background:var(--wab);color:var(--wa);font-size:12.5px;padding:8px 14px;border-radius:10px;margin-bottom:18px}
/* blocks */
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kp div{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;cursor:default}
.kp div[data-a]{cursor:pointer}.kp div[data-a]:hover{border-color:var(--pr)}
.kp b{display:block;font-size:24px;font-weight:900;letter-spacing:-.02em}.kp span{font-size:12.5px;color:var(--mu)}
.g2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media(max-width:1100px){.g2{grid-template-columns:1fr}}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 20px;min-width:0}
.cd h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.cd h3 .mu{font-weight:400}
.mu{color:var(--mu);font-size:12.5px}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--bd);cursor:pointer}
.todo li:first-child{border-top:0}.todo li:hover{background:var(--bg)}
.todo .k{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;flex:none}
.todo .t{flex:1;min-width:0}.todo .go{color:var(--mu)}
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pipe div{background:var(--bg);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;border:1.5px solid transparent}
.pipe div:hover{border-color:var(--pr)}
.pipe b{display:block;font-size:22px;font-weight:900}.pipe span{font-size:11.5px;color:var(--mu);line-height:1.3;display:block}
.pipe div.last{background:var(--okb)}.pipe div.last b{color:var(--ok)}
/* filters / tables */
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fl button{border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:13px}
.fl button.on{background:var(--tx);border-color:var(--tx);color:#fff;font-weight:700}
.fl .n{opacity:.7;margin-left:3px;font-size:12px}
.fl .sp{flex:1}
.tw{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:12px;color:var(--mu);font-weight:700;background:#fafbfd;white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:#f8fafd}
tbody tr:last-child td{border-bottom:0}
td .sub{color:var(--mu);font-size:12px}
.em{padding:40px;text-align:center;color:var(--mu)}
.tg{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.ok{background:var(--okb);color:var(--ok)}.wa{background:var(--wab);color:var(--wa)}.er{background:var(--erb);color:var(--er)}.in{background:var(--inb);color:var(--in)}.no{background:var(--nob);color:var(--no)}
.chp{display:inline-flex;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0;white-space:nowrap}
.chp i{font-style:normal;width:7px;height:7px;border-radius:50%;display:inline-block}
.dots{display:flex;gap:3px;align-items:center}
.dots i{width:18px;height:6px;border-radius:3px;background:var(--bd)}
.dots i.d{background:var(--ac)}.dots i.c{background:var(--pr)}
.btn{border:1.5px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--pr);color:var(--pr)}
.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}.btn.p:hover{color:#fff;filter:brightness(1.08)}
.btn.r{color:var(--er)}.btn.r:hover{border-color:var(--er)}
.btn.s{padding:5px 10px;font-size:12px;border-radius:8px}
.xs{font-size:11px;background:#fff2c2;color:#6b4e00;border-radius:5px;padding:1px 6px;font-weight:700;white-space:nowrap}
/* match board */
.mb{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.mb .cd{padding:16px 18px}
.mr{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}
.mr:hover{background:var(--bg)}
.mr .sj{font-weight:700}
.mr .tn{min-width:0}
.add{border:1.5px dashed var(--bd);border-radius:10px;padding:9px;text-align:center;color:var(--mu);cursor:pointer;margin-top:8px;font-size:13px;font-weight:700}
.add:hover{border-color:var(--pr);color:var(--pr)}
/* lessons */
.dg{margin-bottom:16px}
.dg h4{margin:0 0 8px;font-size:13px;color:var(--mu)}
.dg h4.td{color:var(--pr)}
.ls{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:6px}
.ls select{border:1.5px solid var(--bd);border-radius:8px;padding:5px 8px;background:var(--card)}
/* drawer */
#ov{position:fixed;inset:0;background:rgba(10,29,56,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);background:var(--card);z-index:21;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(10,29,56,.15)}
body.do #ov{opacity:1;pointer-events:auto}body.do #dr{transform:none}
.dh{padding:20px 22px 16px;border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:flex-start}
.dh h2{margin:0;font-size:19px;font-weight:900;letter-spacing:-.02em}
.dh .x{margin-left:auto;border:0;background:var(--bg);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px;flex:none}
.db{padding:18px 22px 40px;overflow-y:auto;flex:1}
.sec{margin-bottom:22px}
.sec>h5{margin:0 0 10px;font-size:12px;letter-spacing:.06em;color:var(--mu);font-weight:700}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--mu)}.kv dd{margin:0}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr .w{grid-column:1/-1}
.fd{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mu);font-weight:700}
.fd input,.fd select,.fd textarea,.db textarea.memo{border:1.5px solid var(--bd);border-radius:10px;padding:9px 11px;background:var(--card);font-weight:400;font-size:13.5px;color:var(--tx);width:100%}
.fd input:focus,.fd select:focus,.fd textarea:focus,.db textarea:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stp{display:flex;gap:0;margin:4px 0 16px}
.stp div{flex:1;text-align:center;position:relative;font-size:11px;color:var(--mu);line-height:1.3}
.stp div::before{content:attr(data-n);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;margin:0 auto 6px;background:var(--bg);border:2px solid var(--bd);font-weight:700;font-size:12px;position:relative;z-index:1}
.stp div::after{content:"";position:absolute;top:13px;left:-50%;right:50%;height:2px;background:var(--bd)}
.stp div:first-child::after{display:none}
.stp div.d::before{background:var(--ac);border-color:var(--ac);color:#fff;content:"✓"}.stp div.d::after,.stp div.c::after{background:var(--ac)}
.stp div.c::before{background:var(--pr);border-color:var(--pr);color:#fff}.stp div.c{color:var(--tx);font-weight:700}
.box{background:var(--pr2);border:1px solid #c9dafc;border-radius:14px;padding:16px}
.box.warn{background:var(--erb);border-color:#f7c8c2}
.box p{margin:0 0 10px;font-size:13px}
.fileln{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:13px}
.fileln .mu{margin-left:auto}
.pv{border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--card)}
.pv .ph{aspect-ratio:16/7;background:linear-gradient(160deg,var(--pr2),var(--bg));display:grid;place-items:center;font-size:40px}
.pv .pb{padding:14px}.pv h4{margin:0 0 2px;font-size:15px}
.mini{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:13px}
.mini:hover{border-color:var(--pr)}.mini .sp{flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--tx);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.2s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 .sb{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;padding:12px;overflow-x:auto}
 .logo small,.sbf{display:none}.nv{flex-direction:row;margin:0}.nv button{white-space:nowrap;padding:8px 10px}
 .top{flex-wrap:wrap;padding:14px 16px;position:static}.top input{width:100%;order:3}
 .ct-w{padding:16px}.pipe{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

 });

 let ls=db.lesson.filter(l=>{const m=M(l.mid);if(!m)return false;const c=C(m.cid),t=T(m.tid);return hit(c.student,t?t.name:"",m.subject)});
 if(f==="week")ls=ls.filter(l=>l.date>=addDays(TODAY,-3)&&l.date<=addDays(TODAY,7));
 else if(f!=="all")ls=ls.filter(l=>l.status===f);
 ls.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 const g={};ls.forEach(l=>(g[l.date]=g[l.date]||[]).push(l));
 const opts=[["week","이번 주",null],["all","전체",db.lesson.length]].concat(LS.map(s=>[s,s,db.lesson.filter(l=>l.status===s).length]));
 return fbar("lesson",opts)+`<p class="mu" style="margin:-4px 0 14px">결석·취소·보강을 나누어 기록합니다. 수업은 매칭 상세에서 추가합니다. <span class="xs">사전 연락 기한·보강 가능 횟수 확정 필요</span></p>`+
 (Object.keys(g).length?Object.keys(g).map(d=>`<div class="dg"><h4 class="${d===TODAY?"td":""}">${md(d)} (${wd(d)})${d===TODAY?" · 오늘":""}</h4>${g[d].map(l=>{const m=M(l.mid),c=C(m.cid),t=T(m.tid);return`<div class="ls"><b>${esc(l.time)}</b><div data-a="open" data-k="match" data-id="${m.id}" style="cursor:pointer;min-width:0">${chip(m.subject)} <b>${esc(c.student)}</b> <span class="mu">· ${esc(t?t.name:"")} 선생님${l.memo?" · "+esc(l.memo):""}</span></div><select data-a2="lstat" data-id="${l.id}">${LS.map(s=>`<option${s===l.status?" selected":""}>${s}</option>`).join("")}</select></div>`}).join("")}</div>`).join(""):`<div class="cd em">해당 기간에 수업이 없습니다.</div>`);
}

function vPay(){
 const f=flt.pay;
 let ps=db.pay.filter(p=>{const m=M(p.mid);if(!m)return false;const c=C(m.cid),t=T(m.tid);return hit(c.student,t?t.name:"",m.subject)});
 if(f==="미결제")ps=ps.filter(p=>p.status==="미결제");
 if(f==="정산대기")ps=ps.filter(p=>p.status==="결제완료"&&p.settle==="대기");
 ps.sort((a,b)=>b.from.localeCompare(a.from));
 const paid=db.pay.filter(p=>p.status==="결제완료").reduce((s,p)=>s+p.amount,0);
 const unpaid=db.pay.filter(p=>p.status==="미결제").reduce((s,p)=>s+p.amount,0);
 const unset=db.pay.filter(p=>p.status==="결제완료"&&p.settle==="대기").reduce((s,p)=>s+p.settleAmt,0);
 return`<div class="kp"><div><b>${won(paid)}</b><span>결제 완료 누계</span></div><div><b>${won(unpaid)}</b><span>미결제</span></div><div><b>${won(unset)}</b><span>선생님 정산 대기</span></div><div><b>${won(paid-db.pay.filter(p=>p.status==="결제완료").reduce((s,p)=>s+p.settleAmt,0))}</b><span>MECA 수익(결제완료 기준)</span></div></div>`+
 fbar("pay",[["all","전체",db.pay.length],["미결제","미결제",db.pay.filter(p=>p.status==="미결제").length],["정산대기","정산 대기",db.pay.filter(p=>p.status==="결제완료"&&p.settle==="대기").length]])+
 `<p class="mu" style="margin:-4px 0 14px">결제는 매칭(학생×과목)별 4주 단위 회차로 관리합니다. <span class="xs">정산 비율·결제 수단·환불 기준 확정 필요</span></p>`+
 `<div class="tw"><table><thead><tr><th>학생 · 과목</th><th>선생님</th><th>회차</th><th>기간</th><th>금액</th><th>결제</th><th>선생님 정산</th><th></th></tr></thead><tbody>${ps.length?ps.map(p=>{const m=M(p.mid),c=C(m.cid),t=T(m.tid);return`<tr data-a="open" data-k="match" data-id="${m.id}"><td><b>${esc(c.student)}</b> ${chip(m.subject)}</td><td>${esc(t?t.name:"-")}</td><td>${p.round}회차</td><td>${md(p.from)} ~ ${md(p.to)}</td><td><b>${won(p.amount)}</b></td><td>${tg(p.status)}${p.paidDate?`<div class="sub">${md(p.paidDate)}</div>`:""}</td><td>${won(p.settleAmt)}<div>${p.status==="결제완료"?tg(p.settle==="완료"?"완료":"대기",p.settle==="완료"?"정산 완료":"정산 대기"):'<span class="sub">결제 후 정산</span>'}</div></td><td style="text-align:right">${p.status==="미결제"?`<button class="btn s p" data-a="paid" data-id="${p.id}">결제 확인</button>`:p.settle==="대기"?`<button class="btn s" data-a="settle" data-id="${p.id}">정산 완료</button>`:""}</td></tr>`}).join(""):`<tr><td colspan="8" class="em">해당하는 결제 회차가 없습니다.</td></tr>`}</tbody></table></div>`;
}

/* ---------- drawers ---------- */
const fld=(k,id,f,label,val,type,opts,w)=>{
 const a=`data-a2="set" data-k="${k}" data-id="${id}" data-f="${f}"`;
 let inp;
 if(type==="select")inp=`<select ${a}>${opts.map(o=>`<option${o===val?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
 else if(type==="textarea")inp=`<textarea rows="2" ${a}>${esc(val)}</textarea>`;
 else inp=`<input type="${type||"text"}" value="${esc(val)}" ${a}>`;
 return`<label class="fd${w?" w":""}">${label}${inp}</label>`;
};
function head(title,sub,tag){return`<div class="dh"><div><h2>${title}</h2><div class="mu" style="margin-top:3px">${sub}</div>${tag?`<div style="margin-top:8px">${tag}</div>`:""}</div><button class="x" data-a="close">×</button></div>`}

  ${m.status!=="시범과외 완료"?fld("match",m.id,"fee","4주 수업료(원)",m.fee,"number"):""}
  ${fld("match",m.id,"memo","메모",m.memo,"textarea",0,1)}</div>
  <div class="acts"><button class="btn s" data-a="open" data-k="consult" data-id="${c.id}">상담 신청서 보기</button>${t?`<button class="btn s" data-a="open" data-k="teacher" data-id="${t.id}">선생님 정보 보기</button>`:""}</div></div>
 <div class="sec"><h5>4주 단위 결제 회차</h5>${ps.length?ps.map(p=>`<div class="mini" style="cursor:default"><b>${p.round}회차</b><span class="sp mu">${md(p.from)} ~ ${md(p.to)} · ${won(p.amount)}</span>${p.status==="미결제"?`<button class="btn s p" data-a="paid" data-id="${p.id}">결제 확인</button>`:tg("결제완료")}${p.status==="결제완료"?(p.settle==="대기"?`<button class="btn s" data-a="settle" data-id="${p.id}">정산</button>`:tg("완료","정산 완료")):""}</div>`).join(""):`<p class="mu" style="margin:0">정규수업 전환 시 생성됩니다.</p>`}</div>
 <div class="sec"><h5>수업 기록</h5>
  ${["시범과외 예정","정규수업"].includes(m.status)?`<div class="fr" style="margin-bottom:10px"><label class="fd">날짜<input type="date" id="nlD" value="${TODAY}"></label><label class="fd">시간<input type="time" id="nlT" value="${(m.trial||"T19:00").slice(11,16)||"19:00"}"></label></div><div class="acts" style="margin:0 0 12px"><button class="btn s" data-a="addLesson" data-id="${m.id}">+ 수업 추가</button></div>`:""}
  ${ls.length?ls.map(l=>`<div class="mini" style="cursor:default"><span class="mu">${md(l.date)}(${wd(l.date)}) ${esc(l.time)}</span><span class="sp">${esc(l.memo)}</span><select data-a2="lstat" data-id="${l.id}" style="border:1.5px solid var(--bd);border-radius:8px;padding:4px 6px">${LS.map(s=>`<option${s===l.status?" selected":""}>${s}</option>`).join("")}</select></div>`).join(""):`<p class="mu" style="margin:0">수업 기록이 없습니다.</p>`}</div>
 </div>`;
}

function dNew(kind){
 if(kind==="consult")return head("상담 직접 등록","전화·카카오톡으로 받은 상담을 등록합니다")+`<div class="db"><div class="fr">
  <label class="fd">학부모 성함<input id="n1"></label><label class="fd">학부모 연락처<input id="n2" placeholder="010-0000-0000"></label>
  <label class="fd">학생 이름<input id="n3"></label><label class="fd">학년<select id="n4">${GRADES.map(g=>`<option>${g}</option>`).join("")}</select></label>
  <label class="fd w">희망 과목 (쉼표로 구분)<input id="n5" placeholder="수학, 과학탐구"></label>
  <label class="fd">수업 형태<select id="n6"><option>비대면</option><option>대면</option><option>대면·비대면</option></select></label><label class="fd">대면 희망 지역<input id="n7"></label>
  <label class="fd w">희망 요일·시간<input id="n8"></label></div>
  <div class="acts"><button class="btn p" data-a="saveNew" data-k="consult">등록</button></div></div>`;
 return head("지원자 직접 등록","사이트 외 경로로 받은 지원서를 등록합니다")+`<div class="db"><div class="fr">
  <label class="fd">이름<input id="n1"></label><label class="fd">연락처<input id="n2"></label>
  <label class="fd">대학교<input id="n3" placeholder="○○대학교 의과대학"></label><label class="fd">학년<select id="n4">${["예과 1학년","예과 2학년","본과 1학년","본과 2학년","본과 3학년","본과 4학년"].map(g=>`<option>${g}</option>`).join("")}</select></label>
  <label class="fd w">지원 과목 (쉼표로 구분)<input id="n5"></label>
  <label class="fd w">재학증명서<input type="file" id="n6"></label></div>
  <div class="acts"><button class="btn p" data-a="saveNew" data-k="teacher">등록</button></div></div>`;
}

/* ---------- render ---------- */
function render(){
 const counts={consult:db.consult.filter(c=>c.status==="신규").length,teacher:db.teacher.filter(t=>!t.out&&[0,1,2,4].includes(t.stage)).length,match:db.match.filter(m=>["매칭 제안","시범과외 완료"].includes(m.status)).length,pay:db.pay.filter(p=>p.status==="미결제").length,dash:0,lesson:0};
 $("#nv").innerHTML=NAV.map(([k,l,i])=>`<button class="${k===view?"on":""}" data-a="nav" data-v="${k}"><span>${i}</span>${l}<span class="ct${counts[k]?"":" z"}">${counts[k]}</span></button>`).join("");
 $("#ttl").textContent=NAV.find(n=>n[0]===view)[1];
 $("#q").style.visibility=view==="dash"?"hidden":"visible";
 $("#view").innerHTML={dash:vDash,consult:vConsult,teacher:vTeacher,match:vMatch,lesson:vLesson,pay:vPay}[view]();
 if(cur)renderDr();
}
function renderDr(){
 let h="";
 if(cur.k==="new")h=dNew(cur.id);
 else{const r=(cur.k==="consult"?C:cur.k==="teacher"?T:M)(cur.id);if(!r){closeDr();return}h={consult:dConsult,teacher:dTeacher,match:dMatch}[cur.k](r)}
 const sc=$(".db")?$(".db").scrollTop:0,same=$("#drb").dataset.cur===cur.k+cur.id;
 $("#drb").innerHTML=h;$("#drb").dataset.cur=cur.k+cur.id;
 if(same&&$(".db"))$(".db").scrollTop=sc;
 document.body.classList.add("do");
}
function openDr(k,id){cur={k,id};renderDr()}
function closeDr(){cur=null;document.body.classList.remove("do")}
const commit=msg=>{save();render();if(msg)toast(msg)};

/* ---------- actions ---------- */
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el)return;
 const a=el.dataset.a,id=el.dataset.id;
 if(el.tagName==="TR"&&e.target.closest("button"))return;
 switch(a){
  case"nav":view=el.dataset.v;closeDr();$("#q").value="";render();window.scrollTo(0,0);break;
  case"go":view=el.dataset.v;flt[view]=el.dataset.f;closeDr();render();break;
  case"flt":flt[el.dataset.key]=el.dataset.f;render();break;
  case"open":e.stopPropagation();openDr(el.dataset.k,id);break;
  case"close":closeDr();break;
  case"reset":if(confirm("시안 데이터를 처음 상태로 되돌릴까요?")){db=JSON.parse(JSON.stringify(SEED));closeDr();commit("초기화했습니다")}break;
  case"newConsult":openDr("new","consult");break;
  case"newTeacher":openDr("new","teacher");break;
  case"saveNew":{
   const v=n=>($("#n"+n).value||"").trim();
   if(!v(1)||!v(2)||(el.dataset.k==="consult"&&!v(3))){toast("필수 항목을 입력하세요");break}
   const subs=v(5).split(/[,，\s]+/).filter(Boolean);
   if(el.dataset.k==="consult"){const c={id:uid("c"),date:TODAY,parent:v(1),phone:v(2),student:v(3),grade:v(4),subjects:subs.length?subs:["종합 상담"],mode:v(6).split("·"),region:v(7),times:v(8),score:"",goal:"",source:"직접 등록",req:"",status:"신규",owner:me,memo:""};db.consult.push(c);cur={k:"consult",id:c.id}}
   else{const f=$("#n6").files[0];const t={id:uid("t"),date:TODAY,name:v(1),phone:v(2),univ:v(3),year:v(4),subjects:subs,stage:0,out:"",certFile:f?f.name:"(미제출)",demoDate:"",demoGrade:"",demoNote:"",contractDate:"",contractFile:"",pMode:"",pRegion:"",pTime:"",pCareer:"",pCurri:"",pColumn:"",memo:""};db.teacher.push(t);cur={k:"teacher",id:t.id}}
   commit("등록했습니다");break}
  case"addMatch":{
   const c=C(id),s=$("#nmS").value,tid=$("#nmT").value;if(!tid){toast("공개 중인 선생님이 없습니다");break}
   if(matchesOf(id).some(m=>m.subject===s&&activeM(m))&&!confirm(s+" 과목에 진행 중인 매칭이 있습니다. 추가할까요?"))break;
   db.match.push({id:uid("m"),cid:id,subject:s,tid,status:"매칭 제안",trial:"",fee:0,sessions:8,memo:""});
   if(["신규","연락 완료"].includes(c.status))c.status="매칭 진행";
   if(!c.owner)c.owner=me;
   commit(`${s} 매칭 제안을 등록했습니다`);break}
  case"tNext":{const t=T(id);
   if(t.stage===1&&!t.demoGrade){toast("검증수업 평가를 입력하세요");break}
   if(t.stage===2&&!t.contractDate){toast("계약일을 입력하세요");break}
   t.stage=Math.min(5,t.stage+1);commit(t.stage===5?`${t.name} 선생님이 사이트에 공개됩니다`:`${TS[t.stage]} 단계로 이동했습니다`);break}
  case"tBack":{const t=T(id);t.stage=t.stage===5?4:3;commit(t.stage===4?"비공개로 전환했습니다":"수정 요청 — 프로필 등록 단계로 돌렸습니다");break}
  case"tOut":{const t=T(id);t.out=el.dataset.o;commit(`${t.name} — ${t.out} 처리`);break}
  case"tRestore":T(id).out="";commit("선발 절차로 복구했습니다");break;
  case"mNext":{const m=M(id),c=C(m.cid);
   if(m.status==="매칭 제안"){if(!m.trial){toast("시범과외 일시를 입력하세요");break}m.status="시범과외 예정";db.lesson.push({id:uid("l"),mid:m.id,date:m.trial.slice(0,10),time:m.trial.slice(11,16),status:"예정",memo:"시범과외"})}
   else if(m.status==="시범과외 예정"){m.status="시범과외 완료";const l=db.lesson.find(x=>x.mid===m.id&&x.memo==="시범과외");if(l)l.status="완료"}
   else if(m.status==="시범과외 완료"){if(!(+m.fee>0)){toast("4주 수업료를 입력하세요");break}m.status="정규수업";newRound(m);c.status="수업 중"}
   commit("상태를 변경했습니다");break}
  case"mRound":newRound(M(id));commit("다음 회차 결제를 생성했습니다");break;
  case"mRe":{const m=M(id);m.status="종료";m.memo=(m.memo?m.memo+" / ":"")+"재매칭으로 종료";const n={id:uid("m"),cid:m.cid,subject:m.subject,tid:"",status:"매칭 제안",trial:"",fee:m.fee,sessions:m.sessions,memo:"재매칭"};const alt=db.teacher.find(x=>!x.out&&x.stage>=5&&x.id!==m.tid&&x.subjects.includes(m.subject))||db.teacher.find(x=>!x.out&&x.stage>=5&&x.id!==m.tid);n.tid=alt?alt.id:m.tid;db.match.push(n);cur={k:"match",id:n.id};commit("재매칭 — 새 매칭 제안을 만들었습니다");break}
  case"mEnd":{if(!confirm("이 매칭을 종료할까요?"))break;const m=M(id);m.status="종료";commit("종료했습니다");break}
  case"paid":{const p=db.pay.find(x=>x.id===id);p.status="결제완료";p.paidDate=TODAY;commit(`${p.round}회차 결제 확인`);break}
  case"settle":{const p=db.pay.find(x=>x.id===id);p.settle="완료";commit("정산 완료 처리");break}
  case"addLesson":{const d=$("#nlD").value,t=$("#nlT").value;if(!d){toast("날짜를 입력하세요");break}db.lesson.push({id:uid("l"),mid:id,date:d,time:t||"19:00",status:"예정",memo:""});commit("수업을 추가했습니다");break}
 }
});
function newRound(m){
 const ps=db.pay.filter(p=>p.mid===m.id);
 const last=ps.sort((a,b)=>b.round-a.round)[0];
 const from=last?addDays(last.to,1):(m.trial?addDays(m.trial.slice(0,10),1):TODAY);
 db.pay.push({id:uid("p"),mid:m.id,round:last?last.round+1:1,from,to:addDays(from,27),amount:+m.fee||0,status:"미결제",paidDate:"",settleAmt:Math.round((+m.fee||0)*0.8),settle:"대기"});
}
document.addEventListener("change",e=>{
 const el=e.target,a=el.dataset.a2;if(!a)return;
 if(a==="set"){const r=(el.dataset.k==="consult"?C:el.dataset.k==="teacher"?T:M)(el.dataset.id);let v=el.value;if(el.type==="number")v=+v||0;r[el.dataset.f]=v;save();
  if(el.tagName==="SELECT")commit();
  else{$("#view").innerHTML={dash:vDash,consult:vConsult,teacher:vTeacher,match:vMatch,lesson:vLesson,pay:vPay}[view]();}}
 if(a==="lstat"){db.lesson.find(l=>l.id===el.dataset.id).status=el.value;commit("수업 상태: "+el.value)}
 if(a==="file"){const t=T(el.dataset.id);if(el.files[0]){t.contractFile=el.files[0].name;commit("계약서를 첨부했습니다")}}
});
$("#q").addEventListener("input",()=>{$("#view").innerHTML={dash:vDash,consult:vConsult,teacher:vTeacher,match:vMatch,lesson:vLesson,pay:vPay}[view]()});
$("#me").innerHTML=OPS.map(o=>`<option${o===me?" selected":""}>${o}</option>`).join("");
$("#me").addEventListener("change",e=>{me=e.target.value;try{localStorage.setItem(KEY+"-me",me)}catch(x){}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDr()});
render();
</script>
</body>
</html>
