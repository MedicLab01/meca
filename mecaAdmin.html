<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MECA 회원 관리</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#6b7684;--bd:#e2e6ec;--pr:#1f6feb;--prt:#fff;--ok:#16794c;--okb:#e0f5ea;--wa:#92600a;--wab:#fdf1d8;--no:#8a8f98;--nob:#eceef1;--er:#b42318;--erb:#fde7e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#9aa5b3;--bd:#2b3441;--pr:#5b9bff;--prt:#0b1220;--ok:#6fd6a2;--okb:#17352a;--wa:#f2c46b;--wab:#3a2e12;--no:#aab2bd;--nob:#2a313b;--er:#ff8a80;--erb:#3d1f1c}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#9aa5b3;--bd:#2b3441;--pr:#5b9bff;--prt:#0b1220;--ok:#6fd6a2;--okb:#17352a;--wa:#f2c46b;--wab:#3a2e12;--no:#aab2bd;--nob:#2a313b;--er:#ff8a80;--erb:#3d1f1c}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.w{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0}h1 small{color:var(--mu);font-weight:400;font-size:13px;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.st{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.st b{display:block;font-size:20px}.st span{color:var(--mu);font-size:12px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);margin-bottom:12px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font:inherit;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--pr);border-color:var(--pr);font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
.bar input{flex:1;min-width:160px}
button.b{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
button.d{color:var(--er)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:600}tr:last-child td{border-bottom:0}
.tg{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px}
.s-ok{background:var(--okb);color:var(--ok)}.s-wa{background:var(--wab);color:var(--wa)}.s-no{background:var(--nob);color:var(--no)}.s-er{background:var(--erb);color:var(--er)}
.sub{color:var(--mu);font-size:12px}.em{padding:36px;text-align:center;color:var(--mu)}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.cd h3{margin:0 0 8px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);padding:0;width:min(520px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
form{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
form h2{grid-column:1/-1;margin:0 0 4px;font-size:16px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu)}
label.f{grid-column:1/-1}
.ac{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
@media(max-width:480px){form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w">
  <h1>MECA 회원 관리 <small>회원 · 매칭 · 수업일정 · 수업료</small></h1>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list">
    <div class="bar">
      <input id="q" type="search" placeholder="검색">
      <select id="sf"></select>
      <button class="b p" id="add">+ 추가</button>
      <button class="b" id="exp">CSV 내보내기</button>
    </div>
    <div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
  </div>
  <div id="match" hidden></div>
</div>
<dialog id="dlg"><form id="fm" method="dialog"></form></dialog>

<script>
const MODE=["온라인","오프라인","온·오프라인"];
const TN=()=>db.teacher.map(t=>t.name), SN=()=>db.student.map(s=>s.name);
const CFG={
 teacher:{label:"선생님",status:["승인대기","활동중","휴식","탈퇴"],
  fields:[["name","이름"],["phone","전화번호","tel"],["univ","대학·학과"],["year","학년"],["subjects","담당 과목"],["mode","수업 방식",MODE],["contact","카카오톡 ID / 이메일","f"],["status","상태","S"],["memo","메모","T"]],
  cols:["name","phone","univ","subjects","mode","status"]},
 student:{label:"학생",status:["상담신청","수업중","휴식","종료"],
  fields:[["name","이름"],["phone","전화번호","tel"],["grade","학년",["고1","고2","고3","N수"]],["goal","목표 대학·학과"],["subjects","희망 과목"],["mode","수업 방식",MODE],["parent","학부모 전화번호","tel"],["teacher","담당 선생님",()=>[""].concat(TN())],["contact","카카오톡 ID / 이메일","f"],["status","상태","S"],["memo","메모","T"]],
  cols:["name","phone","grade","goal","teacher","status"]},
 lesson:{label:"수업",status:["예정","완료","취소"],
  fields:[["date","날짜","date"],["time","시간","time"],["student","학생",SN],["teacher","선생님",TN],["subject","과목"],["mode","방식",MODE],["status","상태","S"],["memo","메모","T"]],
  cols:["date","time","student","teacher","subject","mode","status"]},
 payment:{label:"수업료",status:["완납","부분납","미납"],
  fields:[["student","학생",SN],["month","청구월","month"],["fee","수업료(원)","n"],["paid","납부액(원)","n"],["paidDate","납부일","date"],["teacher","담당 선생님",TN],["pay","선생님 정산액(원)","n"],["settle","선생님 정산",["대기","완료"]],["memo","메모","T"]],
  cols:["student","month","fee","paid","due","paidDate","pstat","settle"]}
};
const TABS=[["teacher","선생님"],["student","학생"],["match","매칭"],["lesson","수업일정"],["payment","수업료"]];
const SEED={
 teacher:[
  {name:"김서연",phone:"010-0000-0001",univ:"서울대 의대",year:"본과 2",subjects:"수학, 과학탐구",mode:"온·오프라인",contact:"seoyeon_k",status:"활동중",memo:""},
  {name:"박민준",phone:"010-0000-0002",univ:"연세대 의대",year:"예과 2",subjects:"영어, 국어",mode:"온라인",contact:"minjun@example.com",status:"활동중",memo:""},
  {name:"이하은",phone:"010-0000-0003",univ:"고려대 의대",year:"본과 1",subjects:"수학",mode:"오프라인",contact:"haeun_l",status:"승인대기",memo:"서류 확인 필요"}],
 student:[
  {name:"최지우",phone:"010-1111-0001",grade:"고3",goal:"의예과",subjects:"수학, 과학탐구",mode:"온라인",parent:"010-2222-0001",contact:"jiwoo_parent",teacher:"김서연",status:"수업중",memo:""},
  {name:"정도윤",phone:"010-1111-0002",grade:"N수",goal:"치의예과",subjects:"영어",mode:"오프라인",parent:"010-2222-0002",contact:"doyoon@example.com",teacher:"박민준",status:"수업중",memo:""},
  {name:"한소미",phone:"010-1111-0003",grade:"고2",goal:"의예과",subjects:"수학",mode:"온·오프라인",parent:"010-2222-0003",contact:"somi_h",teacher:"",status:"상담신청",memo:"주말 수업 희망"}],
 lesson:[
  {date:"2026-11-25",time:"19:00",student:"최지우",teacher:"김서연",subject:"수학",mode:"온라인",status:"예정",memo:""},
  {date:"2026-11-26",time:"16:00",student:"정도윤",teacher:"박민준",subject:"영어",mode:"오프라인",status:"예정",memo:""},
  {date:"2026-11-20",time:"19:00",student:"최지우",teacher:"김서연",subject:"수학",mode:"온라인",status:"완료",memo:""}],
 payment:[
  {student:"최지우",month:"2026-11",fee:400000,paid:400000,paidDate:"2026-11-03",teacher:"김서연",pay:320000,settle:"대기",memo:""},
  {student:"정도윤",month:"2026-11",fee:300000,paid:100000,paidDate:"2026-11-05",teacher:"박민준",pay:240000,settle:"대기",memo:""}]
};
let db={},tab="teacher",editing=null,flt="";
const KEY="meca-admin-v2";
try{db=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem("meca-admin-v1"))||{}}catch(e){}
for(const k in SEED)if(!Array.isArray(db[k]))db[k]=JSON.parse(JSON.stringify(SEED[k]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const won=n=>(Number(n)||0).toLocaleString("ko-KR")+"원";
const pst=r=>(+r.paid>=+r.fee&&+r.fee>0)?"완납":+r.paid>0?"부분납":"미납";
const stOf=r=>tab==="payment"?pst(r):r.status;
const cls=s=>["활동중","수업중","완료","완납"].includes(s)?"s-ok":["승인대기","상담신청","예정","부분납","대기"].includes(s)?"s-wa":s==="미납"?"s-er":"s-no";
const lab=k=>(CFG[tab].fields.find(f=>f[0]===k)||{1:{due:"미수금",pstat:"납부 상태"}[k]})[1];

function stats(){
 const t=db.teacher,s=db.student,due=db.payment.reduce((a,p)=>a+Math.max(0,p.fee-p.paid),0);
 const it=[["활동 중 선생님",t.filter(x=>x.status==="활동중").length],["수업 중 학생",s.filter(x=>x.status==="수업중").length],["미매칭 학생",s.filter(x=>!x.teacher).length],["예정 수업",db.lesson.filter(x=>x.status==="예정").length],["총 수납액",won(db.payment.reduce((a,p)=>a+(+p.paid||0),0))],["미수금",won(due)]];
 $("#stats").innerHTML=it.map(i=>`<div class="st"><b>${i[1]}</b><span>${i[0]}</span></div>`).join("");
}
function cell(k,r){
 if(k==="status")return `<span class="tg ${cls(r.status)}">${esc(r.status)}</span>`;
 if(k==="pstat")return `<span class="tg ${cls(pst(r))}">${pst(r)}</span>`;
 if(k==="settle")return `<span class="tg ${cls(r.settle)}">${esc(r.settle)}</span>`;
 if(k==="name"||(k==="date"&&tab==="lesson")||(k==="student"&&tab==="payment"))return `<b>${esc(r[k])}</b>`+(r.memo&&k!=="date"?`<div class="sub">${esc(r.memo)}</div>`:"");
 if(k==="fee"||k==="paid")return won(r[k]);
 if(k==="due")return won(Math.max(0,r.fee-r.paid));
 return esc(r[k])||'<span class="sub">-</span>';
}
function render(){
 stats();
 $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab${k===tab?" on":""}" data-t="${k}">${l}</button>`).join("");
 const m=tab==="match";$("#list").hidden=m;$("#match").hidden=!m;
 if(m)return renderMatch();
 const c=CFG[tab];
 $("#sf").innerHTML=`<option value="">전체 상태</option>`+c.status.map(s=>`<option${s===flt?" selected":""}>${s}</option>`).join("");
 $("#th").innerHTML="<tr>"+c.cols.map(k=>`<th>${lab(k)}</th>`).join("")+"<th></th></tr>";
 const q=$("#q").value.trim().toLowerCase();
 let rows=db[tab].map((r,i)=>[r,i]).filter(([r])=>(!flt||stOf(r)===flt)&&(!q||Object.values(r).join(" ").toLowerCase().includes(q)));
 if(tab==="lesson")rows.sort((a,b)=>(a[0].date+a[0].time).localeCompare(b[0].date+b[0].time));
 $("#tb").innerHTML=rows.length?rows.map(([r,i])=>"<tr>"+c.cols.map(k=>`<td>${cell(k,r)}</td>`).join("")+`<td style="text-align:right"><button class="b" data-e="${i}">수정</button> <button class="b d" data-d="${i}">삭제</button></td></tr>`).join(""):`<tr><td class="em" colspan="${c.cols.length+1}">조건에 맞는 항목이 없습니다.</td></tr>`;
}
function renderMatch(){
 const act=db.teacher.filter(t=>t.status==="활동중"),un=db.student.map((s,i)=>[s,i]).filter(([s])=>!s.teacher);
 const opts=act.map(t=>`<option value="${esc(t.name)}">${esc(t.name)} · ${esc(t.mode)}</option>`).join("");
 let h=`<div class="mg"><div class="cd"><h3>미매칭 학생 (${un.length})</h3>`+(un.length?un.map(([s,i])=>`<div class="row"><div><b>${esc(s.name)}</b> <span class="sub">${esc(s.grade)} · ${esc(s.subjects)} · ${esc(s.mode)}</span></div><select data-m="${i}"><option value="">선생님 선택</option>${opts}</select></div>`).join(""):`<div class="em">모든 학생이 매칭되었습니다.</div>`)+`</div>`;
 h+=db.teacher.filter(t=>t.status!=="탈퇴").map(t=>{
  const ss=db.student.map((s,i)=>[s,i]).filter(([s])=>s.teacher===t.name);
  return `<div class="cd"><h3>${esc(t.name)} <span class="tg ${cls(t.status)}">${esc(t.status)}</span></h3><div class="sub" style="margin-bottom:6px">${esc(t.univ)} · ${esc(t.subjects)} · ${esc(t.mode)} · 담당 ${ss.length}명</div>`+(ss.length?ss.map(([s,i])=>`<div class="row"><span><b>${esc(s.name)}</b> <span class="sub">${esc(s.grade)} · ${esc(s.subjects)}</span></span><button class="b d" data-u="${i}">해제</button></div>`).join(""):`<div class="sub">담당 학생 없음</div>`)+`</div>`}).join("")+`</div>`;
 $("#match").innerHTML=h;
}
function open(i){
 editing=i;const c=CFG[tab],r=i==null?{status:c.status[0],mode:"온라인",settle:"대기",month:new Date().toISOString().slice(0,7)}:db[tab][i];
 $("#fm").innerHTML=`<h2>${c.label} ${i==null?"추가":"수정"}</h2>`+c.fields.map(([k,l,o])=>{
  const v=esc(r[k]);
  if(o==="T")return `<label class="f">${l}<textarea name="${k}" rows="2">${v}</textarea></label>`;
  if(o==="S"||Array.isArray(o)||typeof o==="function"){const L=o==="S"?c.status:typeof o==="function"?o():o;return `<label>${l}<select name="${k}">${L.map(x=>`<option value="${esc(x)}"${r[k]===x?" selected":""}>${esc(x)||"미배정"}</option>`).join("")}</select></label>`}
  const ty=o==="f"?"text":o==="n"?"number":o||"text";
  return `<label${o==="f"?' class="f"':""}>${l}<input type="${ty}" name="${k}" value="${v}"${k==="name"?" required":""}${ty==="number"?' min="0" step="1000"':""}></label>`}).join("")+
  `<div class="ac"><button type="button" class="b" id="cn">취소</button><button class="b p" type="submit">저장</button></div>`;
 $("#cn").onclick=()=>$("#dlg").close();$("#dlg").showModal();
}
$("#fm").onsubmit=e=>{
 e.preventDefault();
 const d=Object.fromEntries(new FormData($("#fm")).entries());
 CFG[tab].fields.forEach(f=>{if(f[2]==="n")d[f[0]]=+d[f[0]]||0});
 if(editing==null)db[tab].push(d);else db[tab][editing]=d;
 save();$("#dlg").close();render();
};
$("#tb").onclick=e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.e!==undefined)open(+b.dataset.e);
 if(b.dataset.d!==undefined){const r=db[tab][+b.dataset.d];if(confirm("이 항목을 삭제할까요?")){db[tab].splice(+b.dataset.d,1);save();render()}}
};
$("#match").onchange=e=>{const i=e.target.dataset.m;if(i!==undefined&&e.target.value){db.student[i].teacher=e.target.value;if(db.student[i].status==="상담신청")db.student[i].status="수업중";save();render()}};
$("#match").onclick=e=>{const b=e.target.closest("button[data-u]");if(b){db.student[+b.dataset.u].teacher="";save();render()}};
$("#tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;tab=b.dataset.t;$("#q").value="";flt="";render()};
$("#add").onclick=()=>open(null);
$("#q").oninput=render;$("#sf").onchange=()=>{flt=$("#sf").value;render()};
$("#exp").onclick=()=>{
 const c=CFG[tab],k=c.fields.map(f=>f[0]);
 const csv="\uFEFF"+[c.fields.map(f=>f[1])].concat(db[tab].map(r=>k.map(x=>r[x]==null?"":r[x]))).map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download=`meca-${tab}.csv`;a.click();
};
render();
</script>
</body>
</html>
